<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>🎓 Student Portal</h1>

        <button id="themeButton">
            🌙 Dark Mode
        </button>

    </header>


    <!-- MAIN CONTENT -->
    <main>

        <!-- WELCOME -->
        <section class="welcome">

            <h2>
                Welcome,
                <span id="studentName">Rahel</span>!
            </h2>

            <p>
                Here is your student dashboard.
            </p>

        </section>


        <!-- PROFILE -->
        <section class="profile">

            <h2>👤 Student Profile</h2>

            <p>
                Name:
                <span id="name">Rahel Amare</span>
            </p>

            <p>
                Course:
                <span id="course">Computer Science</span>
            </p>

            <p>
                University:
                <span id="university">diredawa University</span>
            </p>

            <button id="profileButton">
                Show Profile
            </button>

            <p id="profileMessage"></p>

        </section>


        <!-- STATISTICS -->
        <section class="stats">

            <div class="card">

                <h3>📚 Courses</h3>

                <p id="courseCount">
                    3
                </p>

            </div>


            <div class="card">

                <h3>📊 GPA</h3>

                <p id="gpa">
                    3.7
                </p>

            </div>


            <div class="card">

                <h3>✅ Completed</h3>

                <p>
                    8
                </p>

            </div>

        </section>


        <!-- COURSES -->
        <section class="courses-section">

            <h2>📚 My Courses</h2>

            <input
                type="text"
                id="searchCourse"
                placeholder="Search course..."
            >


            <div id="courseList">


                <!-- COURSE 1 -->
                <div class="course">

                    <h3>JavaScript</h3>

                    <p>
                        Progress: 80%
                    </p>

                    <button class="viewButton">
                        View Course
                    </button>

                </div>


                <!-- COURSE 2 -->
                <div class="course">

                    <h3>React</h3>

                    <p>
                        Progress: 60%
                    </p>

                    <button class="viewButton">
                        View Course
                    </button>

                </div>


                <!-- COURSE 3 -->
                <div class="course">

                    <h3>Database</h3>

                    <p>
                        Progress: 40%
                    </p>

                    <button class="viewButton">
                        View Course
                    </button>

                </div>


            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
